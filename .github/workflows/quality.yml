name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-quality:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q phase14_main.py external_contract_check.py ed_companion

      - name: Run release contract tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Check repository privacy and hygiene
        run: python tests/check_repository_hygiene.py

      - name: Prepare isolated smoke profile
        shell: pwsh
        run: |
          $journal = Join-Path $env:RUNNER_TEMP "edec-smoke-journal"
          $profile = Join-Path $env:RUNNER_TEMP "edec-smoke-profile"
          New-Item -ItemType Directory -Force -Path $journal, $profile | Out-Null
          Copy-Item -LiteralPath "tests/fixtures/smoke_journal.ndjson" `
            -Destination (Join-Path $journal "Journal.2026-08-23T190000.01.log")
          "LOCALAPPDATA=$profile" >> $env:GITHUB_ENV
          "EDOPS_JOURNAL_DIR=$journal" >> $env:GITHUB_ENV
          "EDOPS_PROFILE_FID=F0000000" >> $env:GITHUB_ENV
          "EDEC_SINGLE_INSTANCE_NAME=EDEC-ci-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_ENV
          "PHASE14_PREVIEW_SKIP_ONBOARDING=1" >> $env:GITHUB_ENV
          "PHASE14_SMOKE_TEST=1" >> $env:GITHUB_ENV
          "QT_QPA_PLATFORM=offscreen" >> $env:GITHUB_ENV

      - name: Run honest QML smoke test
        shell: pwsh
        run: |
          python -B phase14_main.py 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/edec-smoke.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path "$env:RUNNER_TEMP/edec-smoke.log" -Pattern 'PHASE14_SMOKE_REPORT=.*"status": "PASS"')) {
            Write-Error "Smoke process returned success without a PASS report."
            exit 1
          }

      - name: Upload smoke log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: edec-smoke-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/edec-smoke.log
          if-no-files-found: ignore
          retention-days: 7

