name: Release Drift Check

# Purely informational, never fails the build. It exists because 1.5.5
# shipped a stale release asset: the Release workflow only runs on a
# tag push, so two follow-up commits merged onto main afterward (new
# manuals, post-rename links) were never picked up until 1.5.6 re-tagged
# by hand. This surfaces that situation early instead of silently.

on:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compare main against the latest release tag
        shell: bash
        run: |
          latest_tag=$(git tag --list | grep -E '^[0-9]+\.[0-9]+(\.[0-9]+)?$' | sort -t. -k1,1n -k2,2n -k3,3n | tail -n1)
          if [ -z "$latest_tag" ]; then
            echo "No numeric release tag found yet - nothing to compare."
            exit 0
          fi
          ahead=$(git rev-list --count "$latest_tag"..HEAD)
          if [ "$ahead" -gt 0 ]; then
            echo "::notice title=Release drift::main is $ahead commit(s) ahead of the latest tag ($latest_tag). The packaged release ZIP and manuals are only rebuilt on a tag push - if these commits should reach users, bump APP_VERSION in ed_companion/__init__.py and push a new tag."
          else
            echo "main matches the latest tag ($latest_tag) - no drift."
          fi
